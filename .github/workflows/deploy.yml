name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export COMPOSER_ALLOW_SUPERUSER=1
            cd /var/www/docbot
            git fetch origin
            git reset --hard origin/main
            composer install --no-dev --optimize-autoloader
            pkill -f polling.php || true
            sleep 1
            nohup php /var/www/docbot/polling.php > /var/log/docbot-polling.log 2>&1 &
